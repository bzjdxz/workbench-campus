:root{--bg:#f7f5f0;--paper:#fffefa;--side:#f0ebf1;--purple:#78578f;--purple2:#eee6f2;--gold:#b3925c;--text:#342d38;--muted:#8d838e;--line:#e9e2e7;--shadow:0 10px 30px #473a4b0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif;color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:242px;flex-shrink:0;background:var(--side);border-right:1px solid var(--line);padding:28px 18px;position:sticky;top:0;height:100vh}.brand{font-size:19px;font-weight:750;color:#5c3c70;letter-spacing:.5px;padding:8px 10px}.brand small{display:block;font-size:10px;letter-spacing:2px;color:var(--muted);margin-top:7px;font-weight:500}.nav{margin-top:36px;display:grid;gap:8px}.nav button{border:0;background:transparent;text-align:left;padding:13px 15px;border-radius:12px;color:#6e6170}.nav button.active{background:var(--paper);color:var(--purple);box-shadow:var(--shadow);font-weight:700}.sidebar .foot{position:absolute;bottom:25px;font-size:11px;color:var(--muted);padding:0 10px;line-height:1.7}.main{flex:1;min-width:0;max-width:1400px;margin:auto;padding:34px 44px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:28px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--gold);font-weight:700}.top h1{margin:8px 0 5px;font-size:30px;letter-spacing:-1px}.sub{color:var(--muted);font-size:13px}.btn{background:var(--purple);border:1px solid var(--purple);color:white;border-radius:10px;padding:10px 15px}.btn.secondary{background:var(--paper);color:var(--purple);border-color:var(--line)}.btn.danger{background:#fff2f0;color:#ad514b;border-color:#f3dad6}.btn.small{padding:7px 10px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}.stat .num{font-size:31px;color:var(- round:#faf5fc}.datecell b{font-size:12px}.datecell span{display:block;margin-top:5px;font-size:10px;color:var(--purple);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.muted{color:var(--muted)}.pill{font-size:11px;color:var(--muted)}.rowactions{display:flex;gap:5px;flex-wrap:wrap}.notes{font-size:12px;color:var(--muted);line-height:1.7}.banner{padding:14px 18px;background:#f3ecf5;border:1px solid #e5d9eb;border-radius:12px;font-size:12px;color:#765d80;margin-top:20px}.mobiletop{display:none}.birdimg{width:68px;height:68px;object-fit:cover;border-radius:10px;background:var(--purple2)}.progress{height:8px;border-radius:8px;background:var(--purple2);overflow:hidden;margin-top:10px}.progress>div{height:100%;background:var(--purple)}@media(max-width:950px){.sidebar{width:190px}.main{padding:28px 24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}}@media(max-width:650px){.app{display:block}.sidebar{width:100%;height:auto;position:fixed;bottom:0;top:auto;z-index:10;display:flex;padding:6px 4px;border-right:0;border-top:1px solid var(--line);overflow:auto}.sidebar .brand,.sidebar .foot{display:none}.nav{display:flex;margin:0;width:100%;gap:2px;justify-content:space-around}.nav button{padding:10px 8px;white-space:nowrap;font-size:11px}.main{padding:25px 15px 95px}.top h1{font-size:25px}.grid{gap:9px}.card{padding:15px;border-radius:14px}.split{gap:10px}.stat .num{font-size:25px}.day{gap:3px}.datecell{padding:4px;min-height:66px}.datecell span{font-size:9px}.top .btn{font-size:12px;padding:8px}.two{grid-template-columns:1fr}}

.subnav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 17px}.subnav button{border:1px solid var(--line);background:var(--paper);color:var(--purple);padding:10px 14px;border-radius:12px}.subnav button.active{background:var(--purple);color:white}.mini-cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.mini-cal>div{padding:8px 2px;border-radius:8px;text-align:center;font-size:11px;background:#faf8f7}.mini-cal .marked{background:#eee6f2;color:#694a7f;font-weight:750}.mini-cal .current{outline:2px solid #b3925c}.moreback{position:fixed;inset:0;background:#201a25a0;z-index:22;display:none;align-items:flex-end}.moreback.show{display:flex}.moresheet{background:var(--paper);padding:20px;width:100%;border-radius:22px 22px 0 0;display:grid;gap:10px}.moresheet button{padding:14px;text-align:left;background:#f7f4f8;border:0;border-radius:12px;color:var(--text)}@media(min-width:651px){.moreback{align-items:center;justify-content:center}.moresheet{max-width:440px;border-radius:20px}}@media(max-width:650px){.top h1{font-size:27px}.card{padding:17px}.grid{gap:10px}.stat .num{font-size:28px}.mini-cal>div{padding:7px 1px}} </style></head><body><div class="app"><aside class="sidebar"><div class="brand">W / CAMPUS<small>PERSONAL WORKBENCH</small></div><nav class="nav" id="nav"></nav><div class="foot">把学习与生活，放在同一个地方。<br>V1.2 · PWA 版</div></aside><main class="main"><header class="top"><div><div class="eyebrow" id="eyebrow">YOUR PERSONAL SPACE</div><h1 id="heading">我的工作台</h1><div class="sub" id="subtitle"></div></div><button class="btn" onclick="quickAdd()">＋ 快捷添加</button></header><div id="content"></div></main></div><div class="modalback" id="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><h2 id="modaltitle"></h2><form id="modalform" class="form"></form><div class="modalactions"><button class="btn secondary" type="button" onclick="closeModal()">取消</button><button class="btn" type="submit" form="modalform">保存</button></div></div></div><div id="moreback" class="moreback" onclick="if(event.target===this)closeMore()"><div class="moresheet"><strong>更多功能</strong><button onclick="go('workouts');closeMore()">◇ 健身记录</button><button onclick="go('birds');closeMore()">♧ 观鸟作业</button><button onclick="go('notes');closeMore()">✎ 笔记</button><button onclick="go('settings');closeMore()">⚙ 设置与备份</button><button onclick="closeMore()">关闭</button></div></div><script>
'use strict';const KEY='workbench-campus-v1';const today=()=>new Date().toLocaleDateString('sv-SE');const defaultData=()=>({tasks:[],packages:[],workouts:[],birds:[],events:[],notes:[],shopping:[],weights:[],meals:[]});let data;try{data={...defaultData(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{data=defaultData()}let lifeTab='packages',fitnessTab='workouts';let page='home',month=new Date().getMonth(),year=new Date().getFullYear();const pages=[['home','⌂ 总览'],['tasks','▤ 作业'],['calendar','▦ 日程'],['packages','▣ 生活'],['workouts','◇ 健身'],['birds','♧ 观鸟'],['notes','✎ 笔记'],['settings','⚙ 设置']];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('保存失败：可能是浏览器存储空间不足，请先导出备份。')}};const uid=()=>crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);const fmt=s=>s?esc(s):'未设置';const upcoming=()=>data.tasks.filter(t=>!t.done).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));function nav(){const mobile=window.innerWidth<=650;const shown=mobile?pages.slice(0,4):pages;document.getElementById('nav').innerHTML=shown.map(([k,n])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${n}</button>`).join('')+(mobile?`<button class="${['workouts','birds','notes','settings'].includes(page)?'active':''}" onclick="moreMenu()">☷ 更多</button>`:'')}function go(k){page=k;render();window.scrollTo(0,0)}function moreMenu(){document.getElementById('moreback').classList.add('show')}function closeMore(){document.getElementById('moreback').classList.remove('show')}window.addEventListener('resize',()=>nav());function item(name,meta,actions='',badge=''){return `<div class="item"><div class="info"><div class="name">${esc(name)}</div><div class="meta">${meta}</div></div>${badge?`<span class="tag">${esc(badge)}</span>`:''}<div class="rowactions">${actions}</div></div>`}function action(txt,fn){return `<button class="btn secondary small" onclick="${fn}">${txt}</button>`}function section(title,body,extra=''){return `<section class="card"><div class="sectionhead"><h2>${title}</h2>${extra}</div>${body||'<div class="empty">还没有记录，点击添加开始使用。</div>'}</section>`}function render(){nav();document.getElementById('subtitle').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});document.getElementById('heading').textContent=({home:'我的工作台',tasks:'课程与作业',calendar:'日程中心',packages:'生活助手',workouts:'健身记录',birds:'观鸟作业档案',notes:'笔记与灵感',settings:'数据与设置'})[page];document.getElementById('content').innerHTML=({home:home,tasks:tasks,calendar:calendar,packages:packages,workouts:workouts,birds:birds,notes:notes,settings:settings})[page]()}function home(){const pending=upcoming(),pk=data.packages.filter(x=>!x.done),total=data.tasks.length,done=data.tasks.filter(x=>x.done).length;return `<div class="grid">${[['待完成作业',pending.length],['待取快递',pk.length],['已记录鸟种',data.birds.length],['作业完成率',total?Math.round(done/total*100)+'%':'—']].map(([l,v])=>`<div class="card stat"><div class="label">${l}</div><div class="num">${v}</div></div>`).join('')}</div><div class="split">${section('近期作业',pending.slice(0,5).map(t=>item(t.title,`${fmt(t.course)} · 截止 ${fmt(t.due)}`,action('完成',`toggle('tasks','${t.id}')`))).join(''),`<button class="link" onclick="go('tasks')">查看全部 →</button>`)}${section('待取快递',pk.slice(0,5).map(p=>item(p.name,`${fmt(p.location)} · 取件码已隐藏（前往生活查看）`,action('复制取件码',`copyCode('${p.id}')`))).join(''),`<button class="link" onclick="go('packages')">查看全部 →</button>`)}</div><div class="split">${section('今日日程',data.events.filter(e=>e.date===today()).map(e=>item(e.title,fmt(e.time))).join(''),`<button class="link" onclick="go('calendar')">打开日历 →</button>`)}${section('快捷入口',`<div class="rowactions">${[['tasks','添加作业'],['packages','添加快递'],['workouts','记录训练'],['birds','添加鸟种'],['events','添加日程']].map(([k,t])=>`<button class="btn secondary" onclick="openForm('${k}')">＋ ${t}</button>`).join('')}</div>`)}</div>${section('未来七天',weekPreview(),`<button class="link" onclick="go('calendar')">完整日历 →</button>`)}<div class="banner">V1.2：新增生活清单、体重与饮食、PWA 离线支持。数据目前保存在当前浏览器中，不会自动跨设备同步。建议在「设置」定期导出备份；私人取件码不要在共享设备上保存。</div>`}function weekPreview(){let h='<div class="mini-cal">';for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()+i);const ds=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');const count=data.events.filter(x=>x.date===ds).length+data.tasks.filter(x=>!x.done&&x.due===ds).length;h+=`<div class="${count?'marked':''} ${i===0?'current':''}">${['日','一','二','三','四','五','六'][d.getDay()]}<br><b>${d.getDate()}</b>${count?`<br>${count}项`:'<br>·'}</div>`}return h+'</div>'}function tabs(items,selected,fn){return '<div class="subnav">'+items.map(([id,label])=>`<button class="${selected===id?'active':''}" onclick="${fn}('${id}')">${label}</button>`).join('')+'</div>'}function setLifeTab(x){lifeTab=x;render()}function setFitnessTab(x){fitnessTab=x;render()}function shopping(){return `<div class="toolbar"><h2>购物清单</h2><button class="btn" onclick="openForm('shopping')">＋ 添加物品</button></div>${section('待购买 / 已购买',data.shopping.slice().sort((a,b)=>Number(!!a.done)-Number(!!b.done)).map(x=>item((x.done?'✓ ':'')+x.name,`${fmt(x.quantity)} · ${fmt(x.note)}`,action(x.done?'恢复':'已购买',`toggle('shopping','${x.id}')`)+action('删除',`remove('shopping','${x.id}')`))).join(''))}`}function weights(){const arr=data.weights.slice().sort((a,b)=>a.date.localeCompare(b.date));return `<div class="toolbar"><h2>体重趋势</h2><button class="btn" onclick="openForm('weights')">＋ 记录体重</button></div>${arr.length>1?weightChart(arr):''}${section('体重历史',arr.slice().reverse().map(x=>item(x.weight+' kg',`${fmt(x.date)} · ${fmt(x.note)}`,action('删除',`remove('weights','${x.id}')`))).join(''))}`}function weightChart(arr){const vals=arr.slice(-14).map(x=>Number(x.weight)).filter(Number.isFinite);if(vals.length<2)return '';const lo=Math.min(...vals)-.5,hi=Math.max(...vals)+.5;const points=vals.map((v,i)=>`${20+i*360/(vals.length-1)},${125-(v-lo)/(hi-lo)*100}`).join(' ');return `<section class="card" style="margin-bottom:16px"><div class="sectionhead"><h2>最近 ${vals.length} 次记录</h2><span class="pill">${vals.at(-1)} kg</span></div><svg viewBox="0 0 400 145" role="img" aria-label="体重变化折线图" style="width:100%;height:auto"><polyline points="${points}" fill="none" stroke="#78578f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg></section>`}function meals(){return `<div class="toolbar"><h2>饮食记录</h2><button class="btn" onclick="openForm('meals')">＋ 记录饮食</button></div>${section('近期饮食',data.meals.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>item(x.name,`${fmt(x.date)} · ${fmt(x.meal)} · ${fmt(x.protein)} g 蛋白质（自行估算） · ${fmt(x.note)}`,action('删除',`remove('meals','${x.id}')`))).join(''))}<div class="banner">营养数据为自行填写的估算值，不自动代表实际摄入量。</div>`}function tasks(){return `<div class="toolbar"><h2>全部作业 · ${data.tasks.length}</h2><button class="btn" onclick="openForm('tasks')">＋ 新建作业</button></div>${section('按截止日期排列',data.tasks.slice().sort((a,b)=>(a.done-b.done)||(a.due||'9999').localeCompare(b.due||'9999')).map(t=>item(`${t.done?'✓ ':''}${t.title}`,`${fmt(t.course)} · 截止 ${fmt(t.due)}${t.description?' · '+esc(t.description):''}`,action(t.done?'恢复':'完成',`toggle('tasks','${t.id}')`)+action('编辑',`openForm('tasks','${t.id}')`)+action('删除',`remove('tasks','${t.id}')`),t.done?'已完成':t.due&&t.due<today()?'已逾期':'待完成')).join(''))}`}function packages(){return tabs([['packages','快递取件'],['shopping','购物清单']],lifeTab,'setLifeTab')+(lifeTab==='shopping'?shopping():`<div class="toolbar"><h2>快递与取件</h2><button class="btn" onclick="openForm('packages')">＋ 添加快递</button></div>${section('快递清单',data.packages.slice().sort((a,b)=>a.done-b.done).map(p=>item(`${p.done?'✓ ':''}${p.name}`,`取件码：<strong>••••</strong> · ${fmt(p.location)} · 截止 ${fmt(p.due)}`,action('查看',`showCode('${p.id}')`)+action('复制',`copyCode('${p.id}')`)+action(p.done?'恢复':'已取',`toggle('packages','${p.id}')`)+action('编辑',`openForm('packages','${p.id}')`)+action('删除',`remove('packages','${p.id}')`),p.done?'已取件':'待取件')).join(''))}<div class="banner">提醒：此版本不具备系统推送通知。请在日程中查看截止时间，后续版本可增加通知功能。</div>`)}function workouts(){return tabs([['workouts','训练日志'],['weights','体重趋势'],['meals','饮食记录']],fitnessTab,'setFitnessTab')+(fitnessTab==='weights'?weights():fitnessTab==='meals'?meals():`<div class="toolbar"><h2>训练日志</h2><button class="btn" onclick="openForm('workouts')">＋ 记录训练</button></div>${section('历史训练',data.workouts.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(w=>item(w.exercise,`${fmt(w.date)} · ${esc(w.weight)} kg · ${esc(w.sets)} 组 × ${esc(w.reps)} 次${w.note?' · '+esc(w.note):''}`,action('编辑',`openForm('workouts','${w.id}')`)+action('删除',`remove('workouts','${w.id}')`))).join(''))}`)}function birds(){return `<div class="toolbar"><h2>课程观鸟档案</h2><button class="btn" onclick="openForm('birds')">＋ 添加鸟种</button></div><p class="notes">每种鸟仅保留一条档案和一张代表照片。重复观察可更新现有记录。</p>${section('我的鸟种',data.birds.map(b=>`<div class="item">${b.image?`<img class="birdimg" src="${b.image}" alt="鸟类照片">`:'<div class="birdimg"></div>'}<div class="info"><div class="name">${esc(b.name)}</div><div class="meta">${fmt(b.date)} · ${fmt(b.location)} · ${fmt(b.status)}</div></div><div class="rowactions">${action('编辑',`openForm('birds','${b.id}')`)}${action('删除',`remove('birds','${b.id}')`)}</div></div>`).join(''))}`}function notes(){return `<div class="toolbar"><h2>随手记录</h2><button class="btn" onclick="openForm('notes')">＋ 新笔记</button></div>${section('我的笔记',data.notes.slice().reverse().map(n=>item(n.title,esc(n.content).slice(0,150),action('编辑',`openForm('notes','${n.id}')`)+action('删除',`remove('notes','${n.id}')`))).join(''))}`}function calendar(){const first=new Date(year,month,1).getDay(),count=new Date(year,month+1,0).getDate();let days=['日','一','二','三','四','五','六'].map(x=>`<div class="pill" style="text-align:center">周${x}</div>`).join('');for(let i=0;i<first;i++)days+='<div></div>';for(let d=1;d<=count;d++){let dt=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;let es=data.events.filter(e=>e.date===dt),ts=data.tasks.filter(t=>t.due===dt);days+=`<div class="datecell ${dt===today()?'today':''}"><b>${d}</b>${[...es.map(e=>'◦ '+e.title),...ts.map(t=>'• '+t.title)].slice(0,3).map(x=>`<span title="${esc(x)}">${esc(x)}</span>`).join('')}</div>`}return `<div class="toolbar"><div class="rowactions"><button class="btn secondary" onclick="changeMonth(-1)">‹</button><h2 style="padding:8px">${year} 年 ${month+1} 月</h2><button class="btn secondary" onclick="changeMonth(1)">›</button></div><button class="btn" onclick="openForm('events')">＋ 添加日程</button></div>${section('月历',`<div class="day">${days}</div>`)}<div style="height:15px"></div>${section('全部日程',data.events.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>item(e.title,`${fmt(e.date)} ${fmt(e.time)} · ${fmt(e.note)}`,action('编辑',`openForm('events','${e.id}')`)+action('删除',`remove('events','${e.id}')`))).join(''))}`}function changeMonth(n){month+=n;if(month<0){month=11;year--}if(month>11){month=0;year++}render()}function settings(){return `${section('备份与恢复',`<p class="notes">数据保存在本机浏览器。清除浏览器数据或更换设备可能导致记录丢失。请定期导出 JSON 文件备份。</p><div class="rowactions"><button class="btn" onclick="exportData()">↓ 导出数据</button><label class="btn secondary" style="cursor:pointer">↑ 导入备份<input type="file" accept="application/json,.json" style="display:none" onchange="importData(event)"></label></div>`)}<div style="height:16px"></div>${section('隐私与版本',`<p class="notes">V1.2 · 原创静态 PWA。无登录、无服务器、无云同步、无系统通知。快递取件码以明文保存在浏览器本地存储中，不适合公共电脑。图片也保存在本地，体积较大时可能触及存储限制。</p><button class="btn danger" onclick="clearAll()">清空全部数据</button>`)}`}
const fields={tasks:[['title','作业名称','text',true],['course','课程','text'],['due','截止日期','date'],['description','备注','textarea']],packages:[['name','快递名称','text',true],['code','取件码','text'],['location','取件地点','text'],['due','最晚取件日期','date']],workouts:[['exercise','训练动作','text',true],['date','训练日期','date',true],['weight','重量（kg）','number'],['sets','组数','number'],['reps','每组次数','number'],['note','备注','textarea']],birds:[['name','鸟种名称（同一种只保留一条）','text',true],['date','观察日期','date'],['location','观察地点','text'],['status','鉴定状态','select'],['image','代表照片','file']],events:[['title','日程标题','text',true],['date','日期','date',true],['time','时间','time'],['note','备注','textarea']],notes:[['title','标题','text',true],['content','内容','textarea']],shopping:[['name','物品名称','text',true],['quantity','数量','text'],['note','备注','text']],weights:[['date','日期','date',true],['weight','体重（kg）','number',true],['note','备注','text']],meals:[['name','食物名称','text',true],['date','日期','date',true],['meal','餐次','text'],['protein','估算蛋白质（g）','number'],['note','备注','text']]};let currentType,currentId;function openForm(type,id){currentType=type;currentId=id||null;const obj=id?data[type].find(x=>x.id===id):{};document.getElementById('modaltitle').textContent=(id?'编辑':'添加')+({tasks:'作业',packages:'快递',workouts:'训练',birds:'鸟种',events:'日程',notes:'笔记',shopping:'购物物品',weights:'体重',meals:'饮食'})[type];document.getElementById('modalform').innerHTML=fields[type].map(([key,label,kind,required])=>`<label>${label}${kind==='textarea'?`<textarea name="${key}">${esc(obj[key]||'')}</textarea>`:kind==='select'?`<select name="${key}">${['待确认','已确认'].map(v=>`<option ${obj[key]===v?'selected':''}>${v}</option>`).join('')}</select>`:`<input name="${key}" type="${kind==='file'?'file':kind}" ${kind==='file'?'accept="image/*"':''} ${required?'required':''} value="${kind==='file'?'':esc(obj[key]||(kind==='date'&&!id?today():''))}">`}</label>`).join('');document.getElementById('modalback').classList.add('show')}function closeModal(){document.getElementById('modalback').classList.remove('show')}function quickAdd(){openForm('tasks')}document.getElementById('modalform').onsubmit=async e=>{e.preventDefault();const type=currentType,id=currentId,old=id?data[type].find(x=>x.id===id):null,obj={...(old||{}),id:id||uid()};for(const [key,,kind] of fields[type]){const el=e.target.elements.namedItem(key);if(kind==='file'){if(el.files?.[0]){if(el.files[0].size>800000){alert('图片过大，请先压缩到 800KB 以内');return}obj[key]=await new Promise((resolve,reject)=>{const r=new FileReader;r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(el.files[0])})}}else obj[key]=el.value.trim()}if(type==='birds'&&data.birds.some(b=>b.name.trim()===obj.name.trim()&&b.id!==obj.id)){alert('这个鸟种已经有档案，请编辑现有记录。');return}if(old)Object.assign(old,obj);else data[type].push(obj);save();closeModal();render()};function toggle(type,id){const x=data[type].find(x=>x.id===id);if(x){x.done=!x.done;save();render()}}function remove(type,id){if(confirm('确定删除这条记录吗？')){data[type]=data[type].filter(x=>x.id!==id);save();render()}}function showCode(id){const p=data.packages.find(x=>x.id===id);if(p)alert('取件码：'+(p.code||'未填写'))}async function copyCode(id){const code=data.packages.find(x=>x.id===id)?.code||'';if(!code){alert('还没有填写取件码');return}try{await navigator.clipboard.writeText(code);alert('取件码已复制')}catch{prompt('请手动复制取件码',code)}}function exportData(){const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Workbench_Campus_备份_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(e){const f=e.target.files?.[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!x||typeof x!=='object'||!['tasks','packages','workouts','birds','events','notes'].every(k=>Array.isArray(x[k])))throw Error('文件格式不符合本工作台备份格式');if(!confirm('导入将覆盖当前全部数据，确定继续吗？'))return;data={...defaultData(),...x};save();render();alert('导入成功')}catch(err){alert('导入失败：'+err.message)}finally{e.target.value=''}}function clearAll(){if(confirm('确定清空所有记录？此操作不可撤销，请先备份。')&&confirm('再次确认：清空全部数据？')){data=defaultData();save();render()}}render();if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script></body></html>
