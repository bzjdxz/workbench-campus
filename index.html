round:#faf5fc}.datecell b{font-size:12px}.datecell span{display:block;margin-top:5px;font-size:10px;color:var(--purple);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.muted{color:var(--muted)}.pill{font-size:11px;color:var(--muted)}.rowactions{display:flex;gap:5px;flex-wrap:wrap}.notes{font-size:12px;color:var(--muted);line-height:1.7}.banner{padding:14px 18px;background:#f3ecf5;border:1px solid #e5d9eb;border-radius:12px;font-size:12px;color:#765d80;margin-top:20px}.mobiletop{display:none}.birdimg{width:68px;height:68px;object-fit:cover;border-radius:10px;background:var(--purple2)}.progress{height:8px;border-radius:8px;background:var(--purple2);overflow:hidden;margin-top:10px}.progress>div{height:100%;background:var(--purple)}@media(max-width:950px){.sidebar{width:190px}.main{padding:28px 24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}}@media(max-width:650px){.app{display:block}.sidebar{width:100%;height:auto;position:fixed;bottom:0;top:auto;z-index:10;display:flex;padding:6px 4px;border-right:0;border-top:1px solid var(--line);overflow:auto}.sidebar .brand,.sidebar .foot{display:none}.nav{display:flex;margin:0;width:100%;gap:2px;justify-content:space-around}.nav button{padding:10px 8px;white-space:nowrap;font-size:11px}.main{padding:25px 15px 95px}.top h1{font-size:25px}.grid{gap:9px}.card{padding:15px;border-radius:14px}.split{gap:10px}.stat .num{font-size:25px}.day{gap:3px}.datecell{padding:4px;min-height:66px}.datecell span{font-size:9px}.top .btn{font-size:12px;padding:8px}.two{grid-template-columns:1fr}}

:root{--bg:#f7f5f0;--paper:#fffefa;--purple:#77548d;--gold:#b3925c}

.subnav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 17px}.subnav button{border:1px solid var(--line);background:var(--paper);color:var(--purple);padding:10px 14px;border-radius:12px}.subnav button.active{background:var(--purple);color:white}.mini-cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.mini-cal>div{padding:8px 2px;border-radius:8px;text-align:center;font-size:11px;background:#faf8f7}.mini-cal .marked{background:#eee6f2;color:#694a7f;font-weight:750}.mini-cal .current{outline:2px solid #b3925c}.moreback{position:fixed;inset:0;background:#201a25a0;z-index:22;display:none;align-items:flex-end}.moreback.show{display:flex}.moresheet{background:var(--paper);padding:20px;width:100%;border-radius:22px 22px 0 0;display:grid;gap:10px}.moresheet button{padding:14px;text-align:left;background:#f7f4f8;border:0;border-radius:12px;color:var(--text)}@media(min-width:651px){.moreback{align-items:center;justify-content:center}.moresheet{max-width:440px;border-radius:20px}}@media(max-width:650px){.top h1{font-size:27px}.card{padding:17px}.grid{gap:10px}.stat .num{font-size:28px}.mini-cal>div{padding:7px 1px}} </style></head><body><div class="app"><aside class="sidebar"><div class="brand">W / CAMPUS<small>PERSONAL WORKBENCH</small></div><nav class="nav" id="nav"></nav><div class="foot">把学习与生活，放在同一个地方。<br>V1.3 · 手机本地版</div></aside><main class="main"><header class="top"><div><div class="eyebrow" id="eyebrow">YOUR PERSONAL SPACE</div><h1 id="heading">我的工作台</h1><div class="sub" id="subtitle"></div></div><button class="btn" onclick="quickAdd()">＋ 快捷添加</button></header><div id="content"></div></main></div><div class="modalback" id="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><h2 id="modaltitle"></h2><form id="modalform" class="form"></form><div class="modalactions"><button class="btn secondary" type="button" onclick="closeModal()">取消</button><button class="btn" type="submit" form="modalform">保存</button></div></div></div><div id="moreback" class="moreback" onclick="if(event.target===this)closeMore()"><div class="moresheet"><strong>更多功能</strong><button onclick="go('workouts');closeMore()">◇ 健身记录</button><button onclick="go('birds');closeMore()">♧ 观鸟作业</button><button onclick="go('notes');closeMore()">✎ 笔记</button><button onclick="go('ledger');closeMore()">¥ 记账与预算</button><button onclick="go('gear');closeMore()">♧ 徒步装备</button><button onclick="go('recognize');closeMore()">▧ 智能识别</button><button onclick="go('courses');closeMore()">▦ 我的课表</button><button onclick="go('settings');closeMore()">⚙ 设置与备份</button><button onclick="closeMore()">关闭</button></div></div><script>
'use strict';const KEY='workbench-campus-v1';const today=()=>new Date().toLocaleDateString('sv-SE');const defaultData=()=>({tasks:[],packages:[],workouts:[],birds:[],events:[],notes:[],shopping:[],weights:[],meals:[],ledger:[],gear:[],courses:[]});let data;try{data={...defaultData(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{data=defaultData()}let lifeTab='packages',fitnessTab='workouts';let page='home',month=new Date().getMonth(),year=new Date().getFullYear();const pages=[['home','⌂ 总览'],['tasks','▤ 作业'],['calendar','▦ 日程'],['packages','▣ 生活'],['workouts','◇ 健身'],['birds','♧ 观鸟'],['notes','✎ 笔记'],['ledger','¥ 记账'],['gear','♧ 装备'],['recognize','▧ 识别'],['courses','▦ 课表'],['settings','⚙ 设置']];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('保存失败：可能是浏览器存储空间不足，请先导出备份。')}};const uid=()=>crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);const fmt=s=>s?esc(s):'未设置';const upcoming=()=>data.tasks.filter(t=>!t.done).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));function nav(){const mobile=window.innerWidth<=650;const shown=mobile?pages.slice(0,4):pages;document.getElementById('nav').innerHTML=shown.map(([k,n])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${n}</button>`).join('')+(mobile?`<button class="${['workouts','birds','notes','ledger','gear','recognize','courses','settings'].includes(page)?'active':''}" onclick="moreMenu()">☷ 更多</button>`:'')}function go(k){page=k;render();window.scrollTo(0,0)}function moreMenu(){document.getElementById('moreback').classList.add('show')}function closeMore(){document.getElementById('moreback').classList.remove('show')}window.addEventListener('resize',()=>nav());function item(name,meta,actions='',badge=''){return `<div class="item"><div class="info"><div class="name">${esc(name)}</div><div class="meta">${meta}</div></div>${badge?`<span class="tag">${esc(badge)}</span>`:''}<div class="rowactions">${actions}</div></div>`}function action(txt,fn){return `<button class="btn secondary small" onclick="${fn}">${txt}</button>`}function section(title,body,extra=''){return `<section class="card"><div class="sectionhead"><h2>${title}</h2>${extra}</div>${body||'<div class="empty">还没有记录，点击添加开始使用。</div>'}</section>`}function render(){nav();document.getElementById('subtitle').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});document.getElementById('heading').textContent=({home:'我的工作台',tasks:'课程与作业',calendar:'日程中心',packages:'生活助手',workouts:'健身记录',birds:'观鸟作业档案',notes:'笔记与灵感',ledger:'我的账本',gear:'徒步装备库',recognize:'智能识别中心',courses:'我的课程表',settings:'数据与设置'})[page];document.getElementById('content').innerHTML=({home:home,tasks:tasks,calendar:calendar,packages:packages,workouts:workouts,birds:birds,notes:notes,ledger:ledgerPage,gear:gearPage,recognize:recognizePage,courses:coursesPage,settings:settings})[page]()}function home(){const pending=upcoming(),pk=data.packages.filter(x=>!x.done),total=data.tasks.length,done=data.tasks.filter(x=>x.done).length;return `<div class="grid">${[['待完成作业',pending.length],['待取快递',pk.length],['已记录鸟种',data.birds.length],['作业完成率',total?Math.round(done/total*100)+'%':'—']].map(([l,v])=>`<div class="card stat"><div class="label">${l}</div><div class="num">${v}</div></div>`).join('')}</div><div class="split">${section('近期作业',pending.slice(0,5).map(t=>item(t.title,`${fmt(t.course)} · 截止 ${fmt(t.due)}`,action('完成',`toggle('tasks','${t.id}')`))).join(''),`<button class="link" onclick="go('tasks')">查看全部 →</button>`)}${section('待取快递',pk.slice(0,5).map(p=>item(p.name,`${fmt(p.location)} · 取件码已隐藏（前往生活查看）`,action('复制取件码',`copyCode('${p.id}')`))).join(''),`<button class="link" onclick="go('packages')">查看全部 →</button>`)}</div><div class="split">${section('今日日程',data.events.filter(e=>e.date===today()).map(e=>item(e.title,fmt(e.time))).join(''),`<button class="link" onclick="go('calendar')">打开日历 →</button>`)}${section('快捷入口',`<div class="rowactions">${[['tasks','添加作业'],['packages','添加快递'],['workouts','记录训练'],['birds','添加鸟种'],['events','添加日程']].map(([k,t])=>`<button class="btn secondary" onclick="openForm('${k}')">＋ ${t}</button>`).join('')}</div>`)}</div>${section('未来七天',weekPreview(),`<button class="link" onclick="go('calendar')">完整日历 →</button>`)}<div class="banner">V1.2：新增生活清单、体重与饮食、PWA 离线支持。数据目前保存在当前浏览器中，不会自动跨设备同步。建议在「设置」定期导出备份；私人取件码不要在共享设备上保存。</div>`}function weekPreview(){let h='<div class="mini-cal">';for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()+i);const ds=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');const count=data.events.filter(x=>x.date===ds).length+data.tasks.filter(x=>!x.done&&x.due===ds).length;h+=`<div class="${count?'marked':''} ${i===0?'current':''}">${['日','一','二','三','四','五','六'][d.getDay()]}<br><b>${d.getDate()}</b>${count?`<br>${count}项`:'<br>·'}</div>`}return h+'</div>'}function tabs(items,selected,fn){return '<div class="subnav">'+items.map(([id,label])=>`<button class="${selected===id?'active':''}" onclick="${fn}('${id}')">${label}</button>`).join('')+'</div>'}function setLifeTab(x){lifeTab=x;render()}function setFitnessTab(x){fitnessTab=x;render()}function shopping(){return `<div class="toolbar"><h2>购物清单</h2><button class="btn" onclick="openForm('shopping')">＋ 添加物品</button></div>${section('待购买 / 已购买',data.shopping.slice().sort((a,b)=>Number(!!a.done)-Number(!!b.done)).map(x=>item((x.done?'✓ ':'')+x.name,`${fmt(x.quantity)} · ${fmt(x.note)}`,action(x.done?'恢复':'已购买',`toggle('shopping','${x.id}')`)+action('删除',`remove('shopping','${x.id}')`))).join(''))}`}function weights(){const arr=data.weights.slice().sort((a,b)=>a.date.localeCompare(b.date));return `<div class="toolbar"><h2>体重趋势</h2><button class="btn" onclick="openForm('weights')">＋ 记录体重</button></div>${arr.length>1?weightChart(arr):''}${section('体重历史',arr.slice().reverse().map(x=>item(x.weight+' kg',`${fmt(x.date)} · ${fmt(x.note)}`,action('删除',`remove('weights','${x.id}')`))).join(''))}`}function weightChart(arr){const vals=arr.slice(-14).map(x=>Number(x.weight)).filter(Number.isFinite);if(vals.length<2)return '';const lo=Math.min(...vals)-.5,hi=Math.max(...vals)+.5;const points=vals.map((v,i)=>`${20+i*360/(vals.length-1)},${125-(v-lo)/(hi-lo)*100}`).join(' ');return `<section class="card" style="margin-bottom:16px"><div class="sectionhead"><h2>最近 ${vals.length} 次记录</h2><span class="pill">${vals.at(-1)} kg</span></div><svg viewBox="0 0 400 145" role="img" aria-label="体重变化折线图" style="width:100%;height:auto"><polyline points="${points}" fill="none" stroke="#78578f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg></section>`}function meals(){return `<div class="toolbar"><h2>饮食记录</h2><button class="btn" onclick="openForm('meals')">＋ 记录饮食</button></div>${section('近期饮食',data.meals.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>item(x.name,`${fmt(x.date)} · ${fmt(x.meal)} · ${fmt(x.protein)} g 蛋白质（自行估算） · ${fmt(x.note)}`,action('删除',`remove('meals','${x.id}')`))).join(''))}<div class="banner">营养数据为自行填写的估算值，不自动代表实际摄入量。</div>`}function tasks(){return `<div class="toolbar"><h2>全部作业 · ${data.tasks.length}</h2><button class="btn" onclick="openForm('tasks')">＋ 新建作业</button></div>${section('按截止日期排列',data.tasks.slice().sort((a,b)=>(a.done-b.done)||(a.due||'9999').localeCompare(b.due||'9999')).map(t=>item(`${t.done?'✓ ':''}${t.title}`,`${fmt(t.course)} · 截止 ${fmt(t.due)}${t.description?' · '+esc(t.description):''}`,action(t.done?'恢复':'完成',`toggle('tasks','${t.id}')`)+action('编辑',`openForm('tasks','${t.id}')`)+action('删除',`remove('tasks','${t.id}')`),t.done?'已完成':t.due&&t.due<today()?'已逾期':'待完成')).join(''))}`}function packages(){return tabs([['packages','快递取件'],['shopping','购物清单']],lifeTab,'setLifeTab')+(lifeTab==='shopping'?shopping():`<div class="toolbar"><h2>快递与取件</h2><button function csvRows(t){let rows=[],row=[],cur='',quoted=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(quoted&&t[i+1]==='"'){cur+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cur);cur=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);if(row.some(x=>x.trim()))rows.push(row);row=[];cur=''}else cur+=c}row.push(cur);if(row.some(x=>x.trim()))rows.push(row);return rows}
async function importLedgerCSV(e){let f=e.target.files?.[0];if(!f)return;try{let text=await f.text();if(text.charCodeAt(0)===0xfeff)text=text.slice(1);let rows=csvRows(text),hi=rows.findIndex(r=>r.some(x=>/交易时间|交易日期|日期|时间/.test(x))&&r.some(x=>/金额|收入|支出/.test(x)));if(hi<0)throw Error('未找到日期与金额表头；请使用 UTF-8 CSV 文件');let headers=rows[hi],find=(r)=>headers.findIndex(h=>r.test(h));let di=find(/交易时间|交易日期|日期|时间/),ai=find(/金额|收支金额/),inc=find(/^收入/),out=find(/^支出/),typei=find(/收支类型|收\/支|收支/),namei=find(/商品说明|交易对方|商品|备注|交易名称|交易类型|名称/);let parsed=rows.slice(hi+1).map(r=>{let date=(r[di]||'').match(/\d{4}[-\/]\d{1,2}[-\/]\d{1,2}/)?.[0]?.replace(/\//g,'-');let amount=Number(String(r[ai]||'').replace(/[¥￥,\s]/g,''));let kind=/收入|退款/.test(r[typei]||'')?'收入':'支出';if(ai<0&&inc>=0&&out>=0){let a=Number(r[inc]||0),b=Number(r[out]||0);kind=a>0?'收入':'支出';amount=a||b}return {id:uid(),date,amount,kind,category:'其他',title:(r[namei]||'账单导入').slice(0,100)}}).filter(x=>x.date&&x.amount>0&&Number.isFinite(x.amount));if(!parsed.length)throw Error('未识别出有效账单记录');if(!confirm(`识别到 ${parsed.length} 条记录（分类默认为其他）。确认导入？请先备份原有数据。`))return;let old=new Set(data.ledger.map(x=>[x.date,x.amount,x.kind,x.title].join('|'))),added=0;parsed.forEach(x=>{let k=[x.date,x.amount,x.kind,x.title].join('|');if(!old.has(k)){data.ledger.push(x);old.add(k);added++}});save();render();alert(`成功导入 ${added} 条；已跳过 ${parsed.length-added} 条重复记录`)}catch(err){alert('导入失败：'+err.message)}finally{e.target.value=''}}
function gearPage(){let total=data.gear.reduce((a,x)=>a+Number(x.price||0),0),weight=data.gear.reduce((a,x)=>a+Number(x.weight||0),0);return `<div class="grid"><div class="card stat"><div class="label">已有装备</div><div class="num">${data.gear.length} 件</div></div><div class="card stat"><div class="label">装备总价值</div><div class="num">${money(total)}</div></div><div class="card stat"><div class="label">总重量</div><div class="num">${weight.toFixed(0)} g</div></div></div><div style="height:14px"></div><div class="toolbar"><h2>我的徒步装备</h2><div class="rowactions"><button class="btn" onclick="openForm('gear')">＋ 添加装备</button><button class="btn secondary" onclick="openSmartImport('gear')">✦ AI 装备导入</button></div></div>${section('已拥有装备',data.gear.map(x=>item(x.name,`${esc(x.brand||'')} · ${esc(x.category||'其他')} · ${money(x.price)} · ${esc(x.weight||'0')} g · ${esc(x.note||'')}${x.image?' · 已存照片':''}`,action('编辑',`openForm('gear','${x.id}')`)+action('删除',`remove('gear','${x.id}')`))).join(''))}<p class="notes">仅记录已拥有的装备；金额与账本独立，避免自动重复计入支出。</p>`}
function coursesPage(){let days=['周一','周二','周三','周四','周五','周六','周日'];return `<div class="toolbar"><h2>课程安排</h2><button class="btn" onclick="openForm('courses')">＋ 添加课程</button></div><p class="notes">支持周次、节次、教室与教师；截图可先通过智能识别中心提取，再核对导入。</p>${days.map((d,i)=>section(d,data.courses.filter(x=>Number(x.weekday)===i+1).sort((a,b)=>Number(a.period)-Number(b.period)).map(x=>item(x.name,`第 ${esc(x.period||'?')} 节 · ${esc(x.room||'教室待定')} · ${esc(x.weeks||'周次待定')} · ${esc(x.teacher||'')}`,action('编辑',`openForm('courses','${x.id}')`)+action('删除',`remove('courses','${x.id}')`))).join(''))+'<div style="height:12px"></div>').join('')}`}
function recognizePage(){return `${tabs([['package','快递'],['course','课表'],['activity','活动识别']],recognitionType,'setRecognitionType')}<section class="card"><h2>上传截图或粘贴文字</h2><p class="notes">优先使用粘贴文字。截图识别需要首次联网加载 OCR 组件，图片在浏览器本地处理，但组件代码来自第三方 CDN；请勿上传含有无关私人聊天内容的截图。OCR 结果必须核对。</p><div class="form"><label>截图（可选）<input type="file" accept="image/*" id="ocrfile"></label><button class="btn secondary" onclick="runOCR()">识别截图文字</button><label>通知文字<textarea id="sourceText" placeholder="粘贴快递短信、课表、讲座或活动通知"></textarea></label><button class="btn" onclick="parseRecognition()">提取信息</button></div><div id="recognitionResult" style="margin-top:15px"></div></section>`}
function setRecognitionType(x){recognitionType=x;recognitionDraft=null;render()}
async function runOCR(){let f=document.getElementById('ocrfile').files?.[0];if(!f)return alert('请先选择截图');let out=document.getElementById('recognitionResult');out.textContent='正在加载 OCR 并识别，请稍候…';try{if(!window.Tesseract){await new Promise((res,rej)=>{let sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';sc.onload=res;sc.onerror=()=>rej(Error('OCR 组件加载失败，请检查网络'));document.head.appendChild(sc)})}let worker=await Tesseract.createWorker('chi_sim+eng');let r=await worker.recognize(f);await worker.terminate();document.getElementById('sourceText').value=r.data.text;out.textContent='识别完成，请检查文字并点击「提取信息」'}catch(err){out.textContent='OCR 未成功：'+err.message+'。可直接粘贴文字使用。'}}
function parseRecognition(){let text=v('sourceText');if(!text)return alert('请先输入文字');let draft;if(recognitionType==='package'){let code=text.match(/(?:取件码|提货码|取货码|凭证码|取件编号)\s*[:：为是]?\s*([A-Z]?\d{1,5}[-－]\d{2,6}|[A-Z0-9]{4,10})/i)?.[1]||'',loc=text.match(/(?:到达|位于|存放在|请到|前往)\s*([^，。\n]{2,25}(?:驿站|快递柜|服务站|代收点|快递站))/)?.[1]||'';draft={type:'packages',name:'识别快递',code,location:loc,due:''}}else if(recognitionType==='activity'){let date=text.match(/\d{4}[-年/]\d{1,2}[-月/]\d{1,2}日?/)?.[0]||'',time=text.match(/(?:上午|下午|晚上)?\s*\d{1,2}[:：点时]\d{0,2}/)?.[0]||'',loc=text.match(/(?:地点|集合地点)[:：]\s*([^，。\n]+)/)?.[1]||'';draft={type:'events',title:(text.split(/\n/).map(x=>x.trim()).find(x=>x&&!/^(时间|日期|地点|主办|报名|活动时间|活动地点)[:：]/.test(x))||'待确认活动').slice(0,60),date:date.replace(/[年月/]/g,'-').replace(/日/g,'').replace(/-$/,''),time,note:'地点：'+loc+'；原文：'+text.slice(0,400)}}else{let lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean),name=lines.find(x=>/课程|数学|英语|化学|生物|程序|物理|体育|实验|思想/.test(x))||lines[0]||'',weekday=({'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'日':7})[text.match(/(?:星期|周)([一二三四五六日])/)?.[1]]||1,period=text.match(/第\s*(\d+)\s*节/)?.[1]||'',room=text.match(/(?:教室|地点)[:：]?\s*([^，。\n]+)/)?.[1]||'';draft={type:'courses',name:name.slice(0,60),weekday,period,room,weeks:'',teacher:''}}recognitionDraft=draft;document.getElementById('recognitionResult').innerHTML=`<h3>识别预览（可编辑）</h3><p class="notes">未识别到的字段请手动填写，确认后才保存。</p><div class="form">${Object.entries(draft).filter(([k])=>k!=='type').map(([k,val])=>`<label>${esc(({name:'名称',code:'取件码',location:'地点',due:'截止日期',title:'标题',date:'日期',time:'时间',note:'备注',weekday:'星期（1-7）',period:'节次',room:'教室',weeks:'周次',teacher:'教师'})[k]||k)}<input class="search" data-rec="${k}" value="${esc(val)}"></label>`).join('')}<button class="btn" onclick="saveRecognition()">确认并保存</button></div>`}
function saveRecognition(){if(!recognitionDraft)return;let obj={...recognitionDraft,id:uid()};document.querySelectorAll('[data-rec]').forEach(el=>obj[el.dataset.rec]=el.value.trim());let type=obj.type;delete obj.type;if(type==='packages'&&!obj.code)return alert('请先填写取件码');if(type==='events'){if(!/^\d{4}-\d{2}-\d{2}$/.test(obj.date)||Number.isNaN(new Date(obj.date+'T12:00:00').getTime()))return alert('请把活动日期填写为 YYYY-MM-DD，并核对真实日期');if(!/^\d{1,2}:\d{2}$/.test(obj.time))obj.time=''}if(type==='courses'&&!obj.name)return alert('请填写课程名称');if(type==='events'&&data.events.some(e=>e.title===obj.title&&e.date===obj.date&&e.time===obj.time))return alert('日历已有同名同时间活动，请先核对，避免重复');data[type].push(obj);save();alert(type==='events'?'活动已导入日历':'已保存，请到相应模块查看');go(type==='packages'?'packages':type==='events'?'calendar':'courses')}

// V1.3.1: ChatGPT -> JSON -> preview -> selective import, no network/API key required.
let smartKind='',smartDraft=[];
function smartSample(kind){return kind==='gear'?JSON.stringify({type:'gear',records:[{name:'Covert Cardigan 抓绒开衫',brand:'Arc\u0027teryx X000010727 / M / Black Heather',category:'服装',price:1590,weight:565,note:'重量为官方标称，非实测'}]},null,2):JSON.stringify({type:'ledger',records:[{date:'2026-10-30',kind:'支出',amount:16,category:'餐饮',title:'猪脚饭'}]},null,2)}
function openSmartImport(kind){smartKind=kind;smartDraft=[];document.getElementById('modaltitle').textContent=kind==='gear'?'AI 装备数据导入':'AI 截图账单导入';document.getElementById('modalform').innerHTML=`<p class="notes">把照片或截图发给 ChatGPT，让它按下方示例生成 JSON。复制 JSON 粘贴到这里，或选择 JSON 文件。识别和查资料在 ChatGPT 完成，网站不自动上传截图。导入前可逐条核对、修改并去重。</p><label>选择 JSON 文件<input type="file" accept=".json,application/json" id="smartFile" onchange="readSmartFile(event)"></label><label>粘贴 JSON<textarea id="smartJson" rows="9" placeholder="在这里粘贴 ChatGPT 生成的数据"></textarea></label><div class="rowactions"><button type="button" class="btn secondary" onclick="fillSmartSample()">查看格式示例</button><button type="button" class="btn" onclick="previewSmartImport()">预览并核对</button></div><div id="smartPreview"></div>`;document.getElementById('modalform').onsubmit=e=>e.preventDefault();document.getElementById('modalback').classList.add('show')}
function fillSmartSample(){document.getElementById('smartJson').value=smartSample(smartKind)}
async function readSmartFile(e){let f=e.target.files?.[0];if(!f)return;if(f.size>2e6)return alert('JSON 文件不能超过 2MB');document.getElementById('smartJson').value=await f.text()}
function validSmart(x,k){if(k==='gear'){let name=String(x.name||x['装备名称']||'').trim();if(!name)throw Error('装备名称不能为空');let price=x.price??x['购买价格']??'',weight=x.weight??x['重量']??'';if(price!==''&&(!Number.isFinite(Number(price))||Number(price)<0))throw Error(name+'：价格无效');if(weight!==''&&(!Number.isFinite(Number(weight))||Number(weight)<0))throw Error(name+'：重量无效');return {name:name.slice(0,120),brand:String(x.brand||x['品牌型号']||'').slice(0,180),category:String(x.category||x['类别']||'其他').slice(0,50),price:price===''?'':Number(price),weight:weight===''?'':Number(weight),note:String(x.note||x['备注']||'').slice(0,600)}}let date=String(x.date||x['日期']||''),amount=Number(x.amount??x['金额']);if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||Number.isNaN(new Date(date+'T12:00:00').getTime()))throw Error('账单日期无效：'+date);if(!Number.isFinite(amount)||amount<=0)throw Error('账单金额必须大于零');let kind=String(x.kind||x['类型']||'支出');if(!['支出','收入'].includes(kind))throw Error('账单类型只能是支出或收入');return {date,kind,amount,category:String(x.category||x['分类']||'其他').slice(0,40),title:String(x.title||x.note||x['备注']||'').slice(0,120)}}
function smartKey(x,k){return k==='gear'?[x.name.trim().toLowerCase(),x.brand.trim().toLowerCase()].join('|'):[x.date,x.kind,Number(x.amount).toFixed(2),x.category,x.title].join('|')}
function previewSmartImport(){try{let x=JSON.parse(document.getElementById('smartJson').value.trim());if(!x||!Array.isArray(x.records)||x.type!==smartKind)throw Error('需要 {"type":"'+smartKind+'","records":[...]} 格式');if(!x.records.length||x.records.length>100)throw Error('每次支持 1–100 条');smartDraft=x.records.map(y=>validSmart(y,smartKind));let cols=smartKind==='gear'?[['name','装备名称'],['brand','品牌型号'],['category','类别'],['price','价格（元）'],['weight','重量（克）'],['note','备注']]:[['date','日期'],['kind','收支'],['amount','金额'],['category','分类'],['title','备注']];document.getElementById('smartPreview').innerHTML=`<h3>待导入 ${smartDraft.length} 条 · 请核对</h3><p class="notes">勾选需要导入的记录。日期、金额、型号等识别结果可能有误，请逐项确认。</p>${smartDraft.map((x,i)=>`<div class="card" style="margin:12px 0;padding:14px"><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" data-smart-check="${i}" checked> 导入第 ${i+1} 条</label>${cols.map(([k,l])=>`<label>${l}<input class="search" data-smart-index="${i}" data-smart-field="${k}" value="${esc(x[k]??'')}"></label>`).join('')}</div>`).join('')}<button type="button" class="btn" onclick="commitSmartImport()">确认导入已勾选记录</button>`}catch(e){alert('预览失败：'+e.message)}}
function commitSmartImport(){try{let selected=[];document.querySelectorAll('[data-smart-check]:checked').forEach(el=>{let i=Number(el.dataset.smartCheck),x={...smartDraft[i]};document.querySelectorAll('[data-smart-index="'+i+'"]').forEach(inp=>x[inp.dataset.smartField]=inp.value.trim());selected.push(validSmart(x,smartKind))});if(!selected.length)return alert('请至少勾选一条');let old=new Set(data[smartKind].map(x=>smartKey(x,smartKind))),add=[];selected.forEach(x=>{let key=smartKey(x,smartKind);if(!old.has(key)){add.push({...x,id:uid()});old.add(key)}});if(!confirm('将新增 '+add.length+' 条，跳过 '+(selected.length-add.length)+' 条疑似重复记录。确认写入本机数据？'))return;data[smartKind].push(...add);save();resetModalHandler();closeModal();go(smartKind==='gear'?'gear':'ledger');alert('已新增 '+add.length+' 条，跳过 '+(selected.length-add.length)+' 条重复记录。建议及时备份。')}catch(e){alert('导入失败：'+e.message)}}
async function encryptedBackup(){let pass=prompt('设置备份密码（至少 8 位，忘记后无法恢复）');if(pass===null)return;if(pass.length<8)return alert('密码至少 8 位');let salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']),key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt']),raw=new TextEncoder().encode(JSON.stringify({data,budgets:Object.fromEntries(Object.keys(localStorage).filter(k=>k.startsWith('wbc-budget-')).map(k=>[k,localStorage.getItem(k)]))})),cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,raw),b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),payload={format:'WBC-ENC-1',salt:b64(salt),iv:b64(iv),data:b64(cipher)},blob=new Blob([JSON.stringify(payload)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Workbench_Campus_加密备份_'+today()+'.wbc';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
async function restoreEncrypted(e){let f=e.target.files?.[0];if(!f)return;try{let x=JSON.parse(await f.text());if(x.format!=='WBC-ENC-1')throw Error('不是本应用的加密备份');let pass=prompt('请输入备份密码');if(pass===null)return;let bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']),key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(x.salt),iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(x.iv)},key,bytes(x.data)),obj=JSON.parse(new TextDecoder().decode(plain));if(!obj.data||!Array.isArray(obj.data.tasks))throw Error('备份内容无效');if(!confirm('恢复将覆盖当前全部数据，确定继续？'))return;data={...defaultData(),...obj.data};Object.entries(obj.budgets||{}).forEach(([k,val])=>{if(k.startsWith('wbc-budget-'))localStorage.setItem(k,val)});save();render();alert('恢复成功')}catch(err){alert('恢复失败：密码错误或备份损坏（'+err.message+'）')}finally{e.target.value=''}}
